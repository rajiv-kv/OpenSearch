dependencies {
  api project(':libs:opensearch-common')
  api project(':libs:opensearch-core')
  implementation "org.apache.commons:commons-text:1.12.0"
  implementation project(path: ':libs:opensearch-core')
  implementation project(path: ':libs:opensearch-x-content')
  testImplementation "com.carrotsearch.randomizedtesting:randomizedtesting-runner:${versions.randomizedrunner}"
  testImplementation "junit:junit:${versions.junit}"
  testImplementation "org.hamcrest:hamcrest:${versions.hamcrest}"
  testImplementation (project(":test:framework")){
      exclude group: 'org.opensearch', module: 'opensearch-metadata-common'

  }
  implementation "org.apache.lucene:lucene-backward-codecs:9.12.0"
  implementation "org.apache.lucene:lucene-suggest:9.12.0"

}

tasks.named('forbiddenApisMain').configure {
  replaceSignatureFiles 'jdk-signatures'
}

tasks.withType(JavaCompile).configureEach {
  options.compilerArgs -= '-Xlint:cast'
  options.compilerArgs -= '-Xlint:rawtypes'
  options.compilerArgs -= '-Xlint:unchecked'
}


